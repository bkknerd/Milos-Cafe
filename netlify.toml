# Milo's Cafe — Eleventy site edited through Decap CMS at /admin.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

# Short links for print/QR use
[[redirects]]
  from = "/order"
  to = "https://order.spoton.com/so-milos-cafe-21006/morrisville-nc/66f5d47035b06b6ed85df923"
  status = 302
[[redirects]]
  from = "/menu"
  to = "/#menu"
  status = 302
[[redirects]]
  from = "/hours"
  to = "/#visit"
  status = 302
